<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاتورة الطلب - مطعم سمك ابن حميدو</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        oceanBlue: '#0f4c81',
                        deepNavy: '#08233f',
                        seaCyan: '#00b4d8',
                        accentGold: '#fca311',
                        sandBg: '#f8f9fa'
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body class="bg-sandBg text-gray-800 antialiased p-4 md:p-8">

    <!-- حاضنة الفاتورة لعرضها للعميل على الشاشة -->
    <div id="invoice-box" class="max-w-2xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100 p-6 md:p-10">
        
        <!-- Header -->
        <div class="text-center border-b border-gray-200 pb-6 mb-6 flex flex-col items-center">
            <div class="w-20 h-20 md:w-24 md:h-24 rounded-full overflow-hidden border-2 border-accentGold shadow-md mb-3 bg-white flex items-center justify-center">
                <img src="10.png" alt="لوجو مطعم سمك ابن حميدو" class="w-full h-full object-cover">
            </div>
            <h1 class="text-2xl md:text-3xl font-black text-oceanBlue mb-1">مطعم سمك ابن حميدو</h1>
            <p class="text-sm text-gray-500">العاشر من رمضان - أصل الأكل البحري</p>
            <div class="mt-4 inline-block bg-blue-50 text-oceanBlue px-4 py-1.5 rounded-full text-sm font-bold">
                فاتورة طلب عميل
            </div>
        </div>

        <!-- Invoice Details Container -->
        <div id="invoice-items" class="space-y-4 mb-6 overflow-x-auto">
            <!-- Rendered via JS -->
        </div>

        <!-- Totals Summary -->
        <div class="border-t border-gray-200 pt-4 space-y-2 text-sm md:text-base mb-6">
            <div class="flex justify-between text-lg font-black text-gray-900 border-t border-gray-100 pt-2">
                <span>إجمالي المبلغ المطلوب:</span>
                <span id="invoice-total-price" class="text-accentGold text-xl">0 ج.م</span>
            </div>
        </div>

        <!-- Customer Details Form -->
        <div class="bg-gray-50 p-4 md:p-6 rounded-2xl border border-gray-200 space-y-4 mb-6">
            <h3 class="font-bold text-oceanBlue text-base border-b pb-2">بيانات التوصيل</h3>
            
            <!-- Name -->
            <div>
                <label class="block text-xs font-bold text-oceanBlue mb-1">الاسم</label>
                <input type="text" id="customer-name" oninput="validateForm()" placeholder="أدخل اسمك الكريم..." class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:border-oceanBlue text-sm bg-white">
            </div>

            <!-- Phone -->
            <div>
                <label class="block text-xs font-bold text-oceanBlue mb-1">رقم التليفون (11 رقم)</label>
                <input type="tel" id="customer-phone" maxlength="11" oninput="validateForm()" placeholder="مثال: 01012345678" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:border-oceanBlue text-sm bg-white">
                <span id="phone-error" class="text-xs text-red-500 mt-1 hidden">يجب أن يتكون رقم التليفون من 11 رقماً ويبدأ بـ 0</span>
            </div>

            <!-- Address -->
            <div>
                <label class="block text-xs font-bold text-oceanBlue mb-1">العنوان بالتفصيل</label>
                <textarea id="customer-address" rows="3" oninput="validateForm()" placeholder="المنطقة، الشارع، رقم العمارة، الطابق..." class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:border-oceanBlue text-sm bg-white"></textarea>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex gap-4">
            <button id="telegram-btn" onclick="sendOrderToTelegramBot()" disabled class="flex-1 bg-gray-300 text-gray-500 font-bold py-3 rounded-xl transition-all shadow-md text-center flex items-center justify-center gap-2 cursor-not-allowed">
                <span>إرسال الفاتورة عبر تليجرام 🚀</span>
            </button>
            <button onclick="goBackToMenu()" class="flex-1 bg-oceanBlue hover:bg-deepNavy text-white font-bold py-3 rounded-xl transition-all shadow-md text-center">
                العودة للمنيو
            </button>
        </div>

    </div>

    <!-- Canvas مخفي لرسم الفاتورة بدقة وتنسيق ثابت وإرسالها كصورة -->
    <canvas id="invoice-canvas" width="800" style="display: none;"></canvas>

    <script>
        let globalCartData = null;

        document.addEventListener('DOMContentLoaded', () => {
            const cartDataStr = localStorage.getItem('ibnHameedoCart');
            const container = document.getElementById('invoice-items');
            const priceDisplay = document.getElementById('invoice-total-price');

            if (!cartDataStr) {
                container.innerHTML = '<p class="text-center text-gray-500 py-8">لا توجد أصناف مضافة في السلة حالياً.</p>';
                return;
            }

            globalCartData = JSON.parse(cartDataStr);
            if (!globalCartData.items || globalCartData.items.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-8">لا توجد أصناف مضافة في السلة حالياً.</p>';
                return;
            }

            let html = `
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="border-b border-gray-200 text-xs text-gray-500 pb-2">
                            <th class="pb-2 w-2/5">الصنف وملاحظات الطهي</th>
                            <th class="pb-2 text-center w-1/5 text-oceanBlue font-bold">الوزن</th>
                            <th class="pb-2 text-center w-1/5">النوع</th>
                            <th class="pb-2 text-left w-1/5">السعر</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 text-sm">
            `;
            
            globalCartData.items.forEach(item => {
                html += `
                    <tr class="py-3">
                        <td class="py-3">
                            <div class="font-bold text-gray-900">${item.name}</div>
                            ${item.customNote ? `<div class="text-[11px] md:text-xs text-accentGold mt-0.5 font-semibold">ملاحظة: ${item.customNote}</div>` : ''}
                        </td>
                        <td class="py-3 text-center text-xs font-semibold text-gray-600">${item.weight} جم</td>
                        <td class="py-3 text-center text-xs font-semibold text-oceanBlue bg-blue-50/50 rounded">${item.methods.join(', ') || 'عادي'}</td>
                        <td class="py-3 text-left font-black text-accentGold">${item.price.toFixed(2)} ج.م</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;

            priceDisplay.textContent = `${globalCartData.grandTotal.toFixed(2)} ج.م`;
            validateForm();
        });

        function goBackToMenu() {
            window.location.href = 'index.html';
        }

        function validateForm() {
            const name = document.getElementById('customer-name').value.trim();
            const phone = document.getElementById('customer-phone').value.trim();
            const address = document.getElementById('customer-address').value.trim();
            const phoneError = document.getElementById('phone-error');
            const telegramBtn = document.getElementById('telegram-btn');

            const phoneRegex = /^0[0-9]{10}$/;
            const isPhoneValid = phoneRegex.test(phone);

            if (phone.length > 0 && !isPhoneValid) {
                phoneError.classList.remove('hidden');
            } else {
                phoneError.classList.add('hidden');
            }

            if (name !== '' && isPhoneValid && address !== '') {
                telegramBtn.disabled = false;
                telegramBtn.classList.remove('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
                telegramBtn.classList.add('bg-blue-600', 'hover:bg-blue-700', 'text-white', 'shadow-md');
            } else {
                telegramBtn.disabled = true;
                telegramBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700', 'text-white', 'shadow-md');
                telegramBtn.classList.add('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
            }
        }

        // دالة رسم وتوليد الفاتورة كصورة منسقة بدقة برمجياً ثم إرسالها للبوت
        function sendOrderToTelegramBot() {
            const telegramBtn = document.getElementById('telegram-btn');
            const originalText = telegramBtn.innerHTML;
            
            telegramBtn.innerHTML = '<span>جاري تجهيز الفاتورة وإرسالها... ⏳</span>';
            telegramBtn.disabled = true;

            const name = document.getElementById('customer-name').value.trim();
            const phone = document.getElementById('customer-phone').value.trim();
            const address = document.getElementById('customer-address').value.trim();
            const items = globalCartData.items;
            const grandTotal = globalCartData.grandTotal;

            // حساب طول الصورة بناءً على عدد الأصناف لتكون منسقة تماماً
            const canvas = document.getElementById('invoice-canvas');
            const ctx = canvas.getContext('2d');
            
            let baseHeight = 450 + (items.length * 55);
            canvas.height = baseHeight;

            // 1. رسم خلفية بيضاء ونظيفة للفاتورة
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. إطار خارجي مرتب
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 4;
            ctx.strokeRect(15, 15, canvas.width - 30, canvas.height - 30);

            // 3. رأس الفاتورة (اسم المطعم والعنوان)
            ctx.fillStyle = '#0f4c81'; // اللون الأزرق البحري
            ctx.font = '900 28px Cairo, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('مطعم سمك ابن حميدو', canvas.width / 2, 70);

            ctx.fillStyle = '#64748b';
            ctx.font = '600 16px Cairo, sans-serif';
            ctx.fillText('العاشر من رمضان - أصل الأكل البحري', canvas.width / 2, 105);

            // شريط العنوان الفرعي
            ctx.fillStyle = '#eff6ff';
            ctx.roundRect(canvas.width / 2 - 100, 125, 200, 32, 16);
            ctx.fill();
            ctx.fillStyle = '#0f4c81';
            ctx.font = '700 14px Cairo, sans-serif';
            ctx.fillText('فاتورة طلب عميل', canvas.width / 2, 147);

            // 4. خط فاصل
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(50, 180);
            ctx.lineTo(canvas.width - 50, 180);
            ctx.stroke();

            // 5. جدول الأصناف (عناوين الأعمدة)
            ctx.fillStyle = '#64748b';
            ctx.font = '700 13px Cairo, sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText('الصنف وملاحظات الطهي', 70, 215);
            ctx.textAlign = 'center';
            ctx.fillText('الوزن / النوع', 480, 215);
            ctx.textAlign = 'left';
            ctx.fillText('السعر', canvas.width - 70, 215);

            // خط تحت العناوين
            ctx.beginPath();
            ctx.moveTo(50, 230);
            ctx.lineTo(canvas.width - 50, 230);
            ctx.stroke();

            // 6. سرد الأصناف
            let startY = 265;
            ctx.font = '700 15px Cairo, sans-serif';

            items.forEach((item, index) => {
                ctx.textAlign = 'right';
                ctx.fillStyle = '#0f172a';
                ctx.fillText(`${index + 1}. ${item.name}`, 70, startY);

                if (item.customNote) {
                    ctx.fillStyle = '#d97706'; // لون ذهبي للملاحظة
                    ctx.font = '600 12px Cairo, sans-serif';
                    ctx.fillText(`ملاحظة: ${item.customNote}`, 70, startY + 20);
                    ctx.font = '700 15px Cairo, sans-serif';
                }

                // الوزن والنوع
                ctx.textAlign = 'center';
                ctx.fillStyle = '#475569';
                ctx.font = '600 13px Cairo, sans-serif';
                let typeText = `${item.weight} جم (${item.methods.join(', ') || 'عادي'})`;
                ctx.fillText(typeText, 480, startY + 10);

                // السعر
                ctx.textAlign = 'left';
                ctx.fillStyle = '#d97706';
                ctx.font = '900 15px Cairo, sans-serif';
                ctx.fillText(`${item.price.toFixed(2)} ج.م`, canvas.width - 70, startY + 10);

                startY += item.customNote ? 55 : 45;
            });

            // 7. خط فاصل قبل الإجمالي
            ctx.strokeStyle = '#cbd5e1';
            ctx.beginPath();
            ctx.moveTo(50, startY + 10);
            ctx.lineTo(canvas.width - 50, startY + 10);
            ctx.stroke();

            // 8. الإجمالي النهائي
            startY += 45;
            ctx.textAlign = 'right';
            ctx.fillStyle = '#0f172a';
            ctx.font = '900 18px Cairo, sans-serif';
            ctx.fillText('إجمالي المبلغ المطلوب:', 70, startY);

            ctx.textAlign = 'left';
            ctx.fillStyle = '#d97706';
            ctx.font = '900 20px Cairo, sans-serif';
            ctx.fillText(`${grandTotal.toFixed(2)} ج.م`, canvas.width - 70, startY);

            // 9. صندوق بيانات التوصيل داخل الصورة
            startY += 40;
            ctx.fillStyle = '#f8fafc';
            ctx.roundRect(50, startY, canvas.width - 100, 110, 12);
            ctx.fill();
            ctx.strokeStyle = '#e2e8f0';
            ctx.stroke();

            ctx.textAlign = 'right';
            ctx.fillStyle = '#0f4c81';
            ctx.font = '700 14px Cairo, sans-serif';
            ctx.fillText('بيانات التوصيل:', 75, startY + 25);

            ctx.fillStyle = '#334155';
            ctx.font = '600 13px Cairo, sans-serif';
            ctx.fillText(`الاسم: ${name}`, 75, startY + 50);
            ctx.fillText(`التليفون: ${phone}`, 75, startY + 75);
            ctx.fillText(`العنوان: ${address}`, 75, startY + 98);

            // 10. تحويل الـ Canvas إلى ملف صورة (Blob) وإرساله لتليجرام
            canvas.toBlob(blob => {
                let caption = `🛒 *طلب جديد - مطعم سمك ابن حميدو*\n\n`;
                caption += `👤 *الاسم:* ${name}\n`;
                caption += `📞 *التليفون:* ${phone}\n`;
                caption += `📍 *العنوان:* ${address}\n`;
                caption += `💰 *الإجمالي:* ${grandTotal.toFixed(2)} ج.م`;

                const botToken = '8990133528:AAF-Pb82_knno-g_pYxE3qBeEH6_8FoCtvQ'; 
                const chatId = '5847571012';

                const formData = new FormData();
                formData.append('chat_id', chatId);
                formData.append('photo', blob, `invoice-${phone}.png`);
                formData.append('caption', caption);
                formData.append('parse_mode', 'Markdown');

                fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    telegramBtn.innerHTML = originalText;
                    telegramBtn.disabled = false;
                    
                    if (data.ok) {
                        alert('تم إرسال الفاتورة كصورة منسقة وصحيحة بنجاح إلى بوت تليجرام! ✅');
                    } else {
                        alert('حدث خطأ أثناء الإرسال للبوت.');
                        console.error(data);
                    }
                })
                .catch(error => {
                    telegramBtn.innerHTML = originalText;
                    telegramBtn.disabled = false;
                    console.error('Error:', error);
                    alert('فشل الاتصال بسيرفر تليجرام.');
                });

            }, 'image/png');
        }
    </script>
</body>
</html>
