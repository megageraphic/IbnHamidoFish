<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاتورة الطلب - مطعم سمك ابن حميدو</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas Library لتحويل الفاتورة لصورة ريسيت -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        oceanBlue: '#0f4c81',
                        deepNavy: '#08233f',
                        seaCyan: '#00b4d8',
                        accentGold: '#fca311',
                        sandBg: '#f8f9fa'
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8f9fa;
        }
        @media print {
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-sandBg text-gray-800 antialiased p-4 md:p-8">

    <!-- حاضنة الفاتورة (الريسيت) التي ستتحول لصورة وترسل للبوت -->
    <div id="invoice-box" class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-200 p-6">
        
        <!-- Header -->
        <div class="text-center border-b border-gray-200 pb-4 mb-4 flex flex-col items-center">
            <div class="w-16 h-16 rounded-full overflow-hidden border-2 border-accentGold shadow-sm mb-2 bg-white flex items-center justify-center">
                <img src="10.png" alt="لوجو مطعم سمك ابن حميدو" class="w-full h-full object-cover">
            </div>
            <h1 class="text-xl font-black text-oceanBlue mb-1">مطعم سمك ابن حميدو</h1>
            <p class="text-xs text-gray-500">العاشر من رمضان - أصل الأكل البحري</p>
            <div class="mt-3 inline-block bg-blue-50 text-oceanBlue px-3 py-1 rounded-full text-xs font-bold">
                ريسيت طلب عميل
            </div>
        </div>

        <!-- Invoice Details Container -->
        <div id="invoice-items" class="space-y-3 mb-4 text-sm">
            <!-- Rendered via JS -->
        </div>

        <!-- Totals Summary -->
        <div class="border-t border-gray-200 pt-3 space-y-1 mb-4">
            <div class="flex justify-between font-black text-gray-900 text-base">
                <span>الإجمالي المطلوب:</span>
                <span id="invoice-total-price" class="text-accentGold">0 ج.م</span>
            </div>
        </div>

        <!-- Customer Receipt Details (تظهر في الريسيت المصور) -->
        <div id="receipt-customer-info" class="border-t border-dashed border-gray-300 pt-3 text-xs space-y-1 text-gray-700 hidden">
            <p><strong>العميل:</strong> <span id="res-name">---</span></p>
            <p><strong>التليفون:</strong> <span id="res-phone">---</span></p>
            <p><strong>العنوان:</strong> <span id="res-address">---</span></p>
        </div>
    </div>

    <!-- نماذج الإدخال وأزرار التحكم (لا تظهر في صورة الريسيت المرسلة) -->
    <div class="max-w-md mx-auto mt-6 space-y-4 no-print">
        <div class="bg-white p-4 rounded-2xl border border-gray-200 space-y-3 shadow-sm">
            <h3 class="font-bold text-oceanBlue text-sm border-b pb-2">بيانات التوصيل</h3>
            
            <div>
                <label class="block text-xs font-bold text-oceanBlue mb-1">الاسم</label>
                <input type="text" id="customer-name" oninput="validateForm()" placeholder="أدخل اسمك الكريم..." class="w-full px-3 py-2 rounded-xl border border-gray-300 text-sm focus:outline-none focus:border-oceanBlue">
            </div>

            <div>
                <label class="block text-xs font-bold text-oceanBlue mb-1">رقم التليفون (11 رقم)</label>
                <input type="tel" id="customer-phone" maxlength="11" oninput="validateForm()" placeholder="مثال: 01012345678" class="w-full px-3 py-2 rounded-xl border border-gray-300 text-sm focus:outline-none focus:border-oceanBlue">
                <span id="phone-error" class="text-xs text-red-500 mt-1 hidden">يجب أن يتكون رقم التليفون من 11 رقماً ويبدأ بـ 0</span>
            </div>

            <div>
                <label class="block text-xs font-bold text-oceanBlue mb-1">العنوان بالتفصيل</label>
                <textarea id="customer-address" rows="2" oninput="validateForm()" placeholder="المنطقة، الشارع، رقم العمارة، الطابق..." class="w-full px-3 py-2 rounded-xl border border-gray-300 text-sm focus:outline-none focus:border-oceanBlue"></textarea>
            </div>
        </div>

        <div class="flex gap-3">
            <button id="telegram-btn" onclick="sendReceiptImageToTelegram()" disabled class="flex-1 bg-gray-300 text-gray-500 font-bold py-3 rounded-xl transition-all shadow-md text-center flex items-center justify-center gap-2 cursor-not-allowed text-sm">
                <span>إرسال الريسيت (صورة) للبوت 📸</span>
            </button>
            <button onclick="window.print()" class="bg-accentGold hover:bg-amber-600 text-white font-bold px-4 py-3 rounded-xl transition-all shadow-md text-sm">
                طباعة 🖨️
            </button>
        </div>
        <div>
            <button onclick="goBackToMenu()" class="w-full bg-oceanBlue hover:bg-deepNavy text-white font-bold py-3 rounded-xl transition-all shadow-md text-center text-sm">
                العودة للمنيو
            </button>
        </div>
    </div>

    <script>
        let globalCartData = null;

        document.addEventListener('DOMContentLoaded', () => {
            try {
                const cartDataStr = localStorage.getItem('ibnHameedoCart');
                const container = document.getElementById('invoice-items');
                const priceDisplay = document.getElementById('invoice-total-price');

                if (!cartDataStr) {
                    container.innerHTML = '<p class="text-center text-gray-500 py-4 text-xs">لا توجد أصناف مضافة في السلة حالياً.</p>';
                    return;
                }

                globalCartData = JSON.parse(cartDataStr);
                if (!globalCartData || !globalCartData.items || globalCartData.items.length === 0) {
                    container.innerHTML = '<p class="text-center text-gray-500 py-4 text-xs">لا توجد أصناف مضافة في السلة حالياً.</p>';
                    return;
                }

                let html = `
                    <table class="w-full text-right border-collapse text-xs">
                        <thead>
                            <tr class="border-b border-gray-200 text-gray-500 pb-1">
                                <th class="pb-1 w-2/5">الصنف</th>
                                <th class="pb-1 text-center w-1/5">الوزن</th>
                                <th class="pb-1 text-center w-1/5">النوع</th>
                                <th class="pb-1 text-left w-1/5">السعر</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                `;
                
                globalCartData.items.forEach(item => {
                    html += `
                        <tr class="py-2">
                            <td class="py-2">
                                <div class="font-bold text-gray-900">${item.name || ''}</div>
                                ${item.customNote ? `<div class="text-[10px] text-accentGold font-semibold">ملاحظة: ${item.customNote}</div>` : ''}
                            </td>
                            <td class="py-2 text-center text-gray-600">${item.weight || 0} جم</td>
                            <td class="py-2 text-center text-oceanBlue font-semibold">${(item.methods && item.methods.join(', ')) || 'عادي'}</td>
                            <td class="py-2 text-left font-black text-accentGold">${(item.price || 0).toFixed(2)} ج.م</td>
                        </tr>
                    `;
                });

                html += '</tbody></table>';
                container.innerHTML = html;
                priceDisplay.textContent = `${(globalCartData.grandTotal || 0).toFixed(2)} ج.م`;
                
                validateForm();
            } catch (e) {
                console.error("Error loading cart:", e);
            }
        });

        function goBackToMenu() {
            window.location.href = 'index.html';
        }

        function validateForm() {
            const nameInput = document.getElementById('customer-name');
            const phoneInput = document.getElementById('customer-phone');
            const addressInput = document.getElementById('customer-address');
            
            if (!nameInput || !phoneInput || !addressInput) return;

            const name = nameInput.value.trim();
            const phone = phoneInput.value.trim();
            const address = addressInput.value.trim();
            const phoneError = document.getElementById('phone-error');
            const telegramBtn = document.getElementById('telegram-btn');

            const phoneRegex = /^0[0-9]{10}$/;
            const isPhoneValid = phoneRegex.test(phone);

            if (phone.length > 0 && !isPhoneValid) {
                phoneError.classList.remove('hidden');
            } else {
                phoneError.classList.add('hidden');
            }

            if (name !== '' && isPhoneValid && address !== '') {
                telegramBtn.disabled = false;
                telegramBtn.classList.remove('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
                telegramBtn.classList.add('bg-blue-600', 'hover:bg-blue-700', 'text-white', 'shadow-md');
            } else {
                telegramBtn.disabled = true;
                telegramBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700', 'text-white', 'shadow-md');
                telegramBtn.classList.add('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
            }
        }

        // دالة تحويل الريسيت لصورة وإرسالها لبوت تليجرام تلقائياً
        function sendReceiptImageToTelegram() {
            const telegramBtn = document.getElementById('telegram-btn');
            const originalText = telegramBtn.innerHTML;
            
            telegramBtn.innerHTML = '<span>جاري إرسال صورة الريسيت للمطعم... ⏳</span>';
            telegramBtn.disabled = true;

            const name = document.getElementById('customer-name').value.trim();
            const phone = document.getElementById('customer-phone').value.trim();
            const address = document.getElementById('customer-address').value.trim();
            const total = (globalCartData && globalCartData.grandTotal) ? globalCartData.grandTotal.toFixed(2) : '0.00';

            // إظهار بيانات التوصيل داخل الريسيت لكي تظهر في الصورة الملتقطة
            document.getElementById('res-name').textContent = name;
            document.getElementById('res-phone').textContent = phone;
            document.getElementById('res-address').textContent = address;
            document.getElementById('receipt-customer-info').classList.remove('hidden');

            const invoiceBox = document.getElementById('invoice-box');

            // التقاط صندوق الريسيت وتحويله لصورة عالية الدقة
            html2canvas(invoiceBox, {
                scale: 2,
                useCORS: true,
                logging: false
            }).then(canvas => {
                canvas.toBlob(blob => {
                    let caption = `🛒 *طلب جديد (ريسيت مصور)*\n👤 العميل: ${name} - 📞 ${phone}`;

                    const botToken = '8990133528:AAF-Pb82_knno-g_pYxE3qBeEH6_8FoCtvQ'; 
                    const chatId = '5847571012';

                    const formData = new FormData();
                    formData.append('chat_id', chatId);
                    formData.append('photo', blob, `receipt-${phone}.png`);
                    formData.append('caption', caption);
                    formData.append('parse_mode', 'Markdown');

                    fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    })
                    .then(response => response.json())
                    .then(data => {
                        telegramBtn.innerHTML = originalText;
                        telegramBtn.disabled = false;
                        
                        // إخفاء بيانات التوصيل مجدداً من الشاشة إذا أردت
                        document.getElementById('receipt-customer-info').classList.add('hidden');

                        if (data.ok) {
                            alert('تم إرسال صورة الريسيت وتفاصيل الطلب إلى بوت تليجرام بنجاح! ✅');
                        } else {
                            alert('حدث خطأ أثناء الإرسال للبوت.');
                            console.error(data);
                        }
                    })
                    .catch(error => {
                        telegramBtn.innerHTML = originalText;
                        telegramBtn.disabled = false;
                        document.getElementById('receipt-customer-info').classList.add('hidden');
                        console.error('Error:', error);
                        alert('فشل الاتصال بسيرفر تليجرام.');
                    });

                }, 'image/png');
            }).catch(err => {
                console.error("Canvas error:", err);
                alert('حدث خطأ أثناء تصوير الريسيت.');
                telegramBtn.innerHTML = originalText;
                telegramBtn.disabled = false;
                document.getElementById('receipt-customer-info').classList.add('hidden');
            });
        }
    </script>
</body>
</html>
