<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاتورة الطلب - مطعم سمك ابن حميدو</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        oceanBlue: '#0f4c81',
                        deepNavy: '#08233f',
                        seaCyan: '#00b4d8',
                        accentGold: '#fca311',
                        sandBg: '#f8f9fa'
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body class="bg-sandBg text-gray-800 antialiased p-4 md:p-8">

    <div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100 p-6 md:p-10">
        
        <!-- Header -->
        <div class="text-center border-b border-gray-200 pb-6 mb-6">
            <h1 class="text-2xl md:text-3xl font-black text-oceanBlue mb-1">مطعم سمك ابن حميدو</h1>
            <p class="text-sm text-gray-500">العاشر من رمضان - أصل الأكل البحري</p>
            <div class="mt-4 inline-block bg-blue-50 text-oceanBlue px-4 py-1.5 rounded-full text-sm font-bold">
                فاتورة طلب عميل
            </div>
        </div>

        <!-- Invoice Details Container -->
        <div id="invoice-items" class="space-y-4 mb-6">
            <!-- Rendered via JS -->
        </div>

        <!-- Totals Summary (Weight removed) -->
        <div class="border-t border-gray-200 pt-4 space-y-2 text-sm md:text-base mb-8">
            <div class="flex justify-between text-lg font-black text-gray-900 border-t border-gray-100 pt-2">
                <span>إجمالي المبلغ المطلوب:</span>
                <span id="invoice-total-price" class="text-accentGold text-xl">0 ج.م</span>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex gap-4">
            <button onclick="window.print()" class="flex-1 bg-oceanBlue hover:bg-deepNavy text-white font-bold py-3 rounded-xl transition-all shadow-md text-center">
                طباعة الفاتورة
            </button>
            <button onclick="window.location.href='index.html'" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-xl transition-all text-center">
                العودة للمنيو
            </button>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cartDataStr = localStorage.getItem('ibnHameedoCart');
            const container = document.getElementById('invoice-items');
            const priceDisplay = document.getElementById('invoice-total-price');

            if (!cartDataStr) {
                container.innerHTML = '<p class="text-center text-gray-500 py-8">لا توجد أصناف مضافة في السلة حالياً.</p>';
                return;
            }

            const cartData = JSON.parse(cartDataStr);
            if (cartData.items.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-8">لا توجد أصناف مضافة في السلة حالياً.</p>';
                return;
            }

            let html = '<table class="w-full text-right border-collapse"><thead><tr class="border-b border-gray-200 text-xs text-gray-500 pb-2"><th class="pb-2">الصنف والوزن</th><th class="pb-2 text-center">طريقة الطهي</th><th class="pb-2 text-left">السعر</th></tr></thead><tbody class="divide-y divide-gray-100 text-sm">';
            
            cartData.items.forEach(item => {
                html += `
                    <tr class="py-3">
                        <td class="py-3 font-bold text-gray-900">
                            ${item.name}
                            <span class="block text-xs font-normal text-gray-500">${item.weight} جرام</span>
                        </td>
                        <td class="py-3 text-center text-xs font-semibold text-oceanBlue bg-blue-50/50 rounded">${item.methods.join(', ') || 'عادي'}</td>
                        <td class="py-3 text-left font-black text-accentGold">${item.price.toFixed(2)} ج.م</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;

            priceDisplay.textContent = `${cartData.grandTotal.toFixed(2)} ج.م`;
        });
    </script>
</body>
</html>
