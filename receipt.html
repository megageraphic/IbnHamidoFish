<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاتورة الطلب - مطعم سمك ابن حميدو</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        oceanBlue: '#0f4c81',
                        deepNavy: '#08233f',
                        seaCyan: '#00b4d8',
                        accentGold: '#fca311',
                        sandBg: '#f8f9fa'
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body class="bg-sandBg text-gray-800 antialiased p-4 md:p-8">

    <div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100 p-6 md:p-10">
        
        <!-- Header -->
        <div class="text-center border-b border-gray-200 pb-6 mb-6 flex flex-col items-center">
            <div class="w-20 h-20 md:w-24 md:h-24 rounded-full overflow-hidden border-2 border-accentGold shadow-md mb-3 bg-white flex items-center justify-center">
                <img src="10.png" alt="لوجو مطعم سمك ابن حميدو" class="w-full h-full object-cover">
            </div>
            <h1 class="text-2xl md:text-3xl font-black text-oceanBlue mb-1">مطعم سمك ابن حميدو</h1>
            <p class="text-sm text-gray-500">العاشر من رمضان - أصل الأكل البحري</p>
            <div class="mt-4 inline-block bg-blue-50 text-oceanBlue px-4 py-1.5 rounded-full text-sm font-bold">
                ريست فاتورة العميل
            </div>
        </div>

        <!-- Invoice Details Container (Receipt View) -->
        <div id="invoice-items" class="space-y-4 mb-6 overflow-x-auto">
            <!-- Rendered via JS -->
        </div>

        <!-- Totals Summary -->
        <div class="border-t border-gray-200 pt-4 space-y-2 text-sm md:text-base mb-6">
            <div class="flex justify-between text-lg font-black text-gray-900 border-t border-gray-100 pt-2">
                <span>إجمالي المبلغ المطلوب:</span>
                <span id="invoice-total-price" class="text-accentGold text-xl">0 ج.م</span>
            </div>
        </div>

        <!-- Customer Details Form -->
        <div class="bg-gray-50 p-4 md:p-6 rounded-2xl border border-gray-200 space-y-4 mb-6">
            <h3 class="font-bold text-oceanBlue text-base border-b pb-2">بيانات التوصيل</h3>
            
            <!-- Name -->
            <div>
                <label class="block text-xs font-bold text-oceanBlue mb-1">الاسم</label>
                <input type="text" id="customer-name" oninput="validateForm()" placeholder="أدخل اسمك الكريم..." class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:border-oceanBlue text-sm bg-white">
            </div>

            <!-- Phone -->
            <div>
                <label class="block text-xs font-bold text-oceanBlue mb-1">رقم التليفون (11 رقم)</label>
                <input type="tel" id="customer-phone" maxlength="11" oninput="validateForm()" placeholder="مثال: 01012345678" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:border-oceanBlue text-sm bg-white">
                <span id="phone-error" class="text-xs text-red-500 mt-1 hidden">يجب أن يتكون رقم التليفون من 11 رقماً ويبدأ بـ 0</span>
            </div>

            <!-- Address -->
            <div>
                <label class="block text-xs font-bold text-oceanBlue mb-1">العنوان بالتفصيل</label>
                <textarea id="customer-address" rows="3" oninput="validateForm()" placeholder="المنطقة، الشارع، رقم العمارة، الطابق..." class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:border-oceanBlue text-sm bg-white"></textarea>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex gap-4">
            <button id="telegram-btn" onclick="sendOrderToTelegramBot()" disabled class="flex-1 bg-gray-300 text-gray-500 font-bold py-3 rounded-xl transition-all shadow-md text-center flex items-center justify-center gap-2 cursor-not-allowed">
                <span>تأكيد وإرسال الطلب 🚀</span>
            </button>
            <button onclick="goBackToMenu()" class="flex-1 bg-oceanBlue hover:bg-deepNavy text-white font-bold py-3 rounded-xl transition-all shadow-md text-center">
                العودة للمنيو
            </button>
        </div>

    </div>

    <script>
        let globalCartData = null;

        document.addEventListener('DOMContentLoaded', () => {
            try {
                const cartDataStr = localStorage.getItem('ibnHameedoCart');
                const container = document.getElementById('invoice-items');
                const priceDisplay = document.getElementById('invoice-total-price');

                if (!cartDataStr) {
                    container.innerHTML = '<p class="text-center text-gray-500 py-8">لا توجد أصناف مضافة في السلة حالياً.</p>';
                    return;
                }

                globalCartData = JSON.parse(cartDataStr);
                if (!globalCartData || !globalCartData.items || globalCartData.items.length === 0) {
                    container.innerHTML = '<p class="text-center text-gray-500 py-8">لا توجد أصناف مضافة في السلة حالياً.</p>';
                    return;
                }

                let html = `
                    <table class="w-full text-right border-collapse">
                        <thead>
                            <tr class="border-b border-gray-200 text-xs text-gray-500 pb-2">
                                <th class="pb-2 w-2/5">الصنف وملاحظات الطهي</th>
                                <th class="pb-2 text-center w-1/5 text-oceanBlue font-bold">الوزن</th>
                                <th class="pb-2 text-center w-1/5">النوع</th>
                                <th class="pb-2 text-left w-1/5">السعر</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100 text-sm">
                `;
                
                globalCartData.items.forEach(item => {
                    html += `
                        <tr class="py-3">
                            <td class="py-3">
                                <div class="font-bold text-gray-900">${item.name || ''}</div>
                                ${item.customNote ? `<div class="text-[11px] md:text-xs text-accentGold mt-0.5 font-semibold">ملاحظة: ${item.customNote}</div>` : ''}
                            </td>
                            <td class="py-3 text-center text-xs font-semibold text-gray-600">${item.weight || 0} جم</td>
                            <td class="py-3 text-center text-xs font-semibold text-oceanBlue bg-blue-50/50 rounded">${(item.methods && item.methods.join(', ')) || 'عادي'}</td>
                            <td class="py-3 text-left font-black text-accentGold">${(item.price || 0).toFixed(2)} ج.م</td>
                        </tr>
                    `;
                });

                html += '</tbody></table>';
                container.innerHTML = html;
                priceDisplay.textContent = `${(globalCartData.grandTotal || 0).toFixed(2)} ج.م`;
                
                validateForm();
            } catch (e) {
                console.error("Error loading cart:", e);
                document.getElementById('invoice-items').innerHTML = '<p class="text-center text-red-500 py-8">حدث خطأ في تحميل البيانات، يرجى العودة للمنيو وإعادة المحاولة.</p>';
            }
        });

        function goBackToMenu() {
            window.location.href = 'index.html';
        }

        function validateForm() {
            const nameInput = document.getElementById('customer-name');
            const phoneInput = document.getElementById('customer-phone');
            const addressInput = document.getElementById('customer-address');
            
            if (!nameInput || !phoneInput || !addressInput) return;

            const name = nameInput.value.trim();
            const phone = phoneInput.value.trim();
            const address = addressInput.value.trim();
            const phoneError = document.getElementById('phone-error');
            const telegramBtn = document.getElementById('telegram-btn');

            const phoneRegex = /^0[0-9]{10}$/;
            const isPhoneValid = phoneRegex.test(phone);

            if (phone.length > 0 && !isPhoneValid) {
                phoneError.classList.remove('hidden');
            } else {
                phoneError.classList.add('hidden');
            }

            if (name !== '' && isPhoneValid && address !== '') {
                telegramBtn.disabled = false;
                telegramBtn.classList.remove('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
                telegramBtn.classList.add('bg-blue-600', 'hover:bg-blue-700', 'text-white', 'shadow-md');
            } else {
                telegramBtn.disabled = true;
                telegramBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700', 'text-white', 'shadow-md');
                telegramBtn.classList.add('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
            }
        }

        function sendOrderToTelegramBot() {
            const telegramBtn = document.getElementById('telegram-btn');
            const originalText = telegramBtn.innerHTML;
            
            telegramBtn.innerHTML = '<span>جاري إرسال الطلب... ⏳</span>';
            telegramBtn.disabled = true;

            const name = document.getElementById('customer-name').value.trim();
            const phone = document.getElementById('customer-phone').value.trim();
            const address = document.getElementById('customer-address').value.trim();
            const total = (globalCartData && globalCartData.grandTotal) ? globalCartData.grandTotal.toFixed(2) : '0.00';

            let message = `🧾 *ريست فاتورة طلب جديدة - مطعم سمك ابن حميدو*\n`;
            message += `──────────────────\n`;
            message += `👤 *العميل:* ${name}\n`;
            message += `📞 *التليفون:* \`${phone}\`\n`;
            message += `📍 *العنوان:* ${address}\n`;
            message += `──────────────────\n`;
            message += `📋 *الأصناف المطلوبة (الريست):*\n`;

            globalCartData.items.forEach((item, index) => {
                message += `\n*${index + 1}. ${item.name}*`;
                message += `\n   ▫️ الوزن: ${item.weight} جم | النوع: ${(item.methods && item.methods.join(', ')) || 'عادي'}`;
                if (item.customNote) {
                    message += `\n   ▫️ ملاحظة: _(${item.customNote})_`;
                }
                message += `\n   ▫️ السعر: *${item.price.toFixed(2)} ج.م*`;
            });

            message += `\n\n──────────────────\n`;
            message += `💰 *الإجمالي النهائي المطلوب:* *${total} ج.م*\n`;
            message += `──────────────────`;

            const botToken = '8990133528:AAF-Pb82_knno-g_pYxE3qBeEH6_8FoCtvQ'; 
            const chatId = '5847571012';

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message,
                    parse_mode: 'Markdown'
                })
            })
            .then(response => response.json())
            .then(data => {
                telegramBtn.innerHTML = originalText;
                telegramBtn.disabled = false;
                
                if (data.ok) {
                    alert('تم عرض الريست للعميل وإرسال تفاصيل الفاتورة للمطعم بنجاح! ✅');
                } else {
                    alert('حدث خطأ أثناء الإرسال.');
                    console.error(data);
                }
            })
            .catch(error => {
                telegramBtn.innerHTML = originalText;
                telegramBtn.disabled = false;
                console.error('Error:', error);
                alert('فشل الاتصال.');
            });
        }
    </script>
</body>
</html>
