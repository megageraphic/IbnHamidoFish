<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو مطعم سمك ابن حميدو - العاشر من رمضان</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        oceanBlue: '#0f4c81',
                        deepNavy: '#08233f',
                        seaCyan: '#00b4d8',
                        accentGold: '#fca311',
                        sandBg: '#f8f9fa'
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8f9fa;
            padding-bottom: 100px;
        }
        .hero-bg {
            background: linear-gradient(rgba(8, 35, 63, 0.85), rgba(15, 76, 129, 0.9)), url('11.png');
            background-size: cover;
            background-position: center;
        }
        .category-tab.active {
            background-color: #0f4c81 !important;
            color: white !important;
            box-shadow: 0 2px 4px -1px rgba(15, 76, 129, 0.3);
        }
        .footer-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 35px;
            height: 35px;
            background-color: rgba(255, 255, 255, 0.1);
            color: #fca311;
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        .footer-btn:hover {
            background-color: #fca311;
            color: #08233f;
        }
    </style>
</head>
<body class="bg-sandBg text-gray-800 antialiased">

    <!-- Header & Hero Section (Compact) -->
    <header class="hero-bg text-white shadow-md">
        <div class="container mx-auto px-4 py-5 flex flex-col items-center text-center">
            <div class="w-20 h-20 md:w-24 md:h-24 rounded-full overflow-hidden border-2 border-accentGold shadow-lg mb-2 bg-white flex items-center justify-center">
                <img src="10.png" alt="لوجو مطعم سمك ابن حميدو" class="w-full h-full object-cover">
            </div>
            <h1 class="text-2xl md:text-3xl font-black mb-1 text-accentGold tracking-wide">مطعم سمك ابن حميدو</h1>
            <p class="text-xs md:text-sm font-semibold mb-1 text-seaCyan">أصل الأكل البحري - العاشر من رمضان</p>
            
            <div class="flex flex-wrap justify-center gap-2 text-xs font-medium">
                <span class="bg-white/10 px-3 py-1 rounded-full backdrop-blur-sm border border-white/20">العاشر من رمضان، مصر</span>
            </div>
        </div>
    </header>

    <!-- Navigation / Categories Tabs (Compact) -->
    <nav class="sticky top-0 z-50 bg-white/95 backdrop-blur-md shadow-sm py-2.5 transition-all">
        <div id="categoriesNav" class="container mx-auto px-4 flex overflow-x-auto space-x-2 space-x-reverse scrollbar-none justify-start md:justify-center">
            <button onclick="filterCategory('الأسماك')" id="btn-الأسماك" class="category-tab active px-4 py-1.5 rounded-full text-xs font-bold transition-all whitespace-nowrap bg-gray-100 text-gray-700 hover:bg-oceanBlue hover:text-white">
                الأسماك
            </button>
            <button onclick="filterCategory('الجمبري')" id="btn-الجمبري" class="category-tab px-4 py-1.5 rounded-full text-xs font-bold transition-all whitespace-nowrap bg-gray-100 text-gray-700 hover:bg-oceanBlue hover:text-white">
                الجمبري
            </button>
            <button onclick="filterCategory('المقبلات والسلطات')" id="btn-المقبلات" class="category-tab px-4 py-1.5 rounded-full text-xs font-bold transition-all whitespace-nowrap bg-gray-100 text-gray-700 hover:bg-oceanBlue hover:text-white">
                المقبلات والسلطات
            </button>
            <button onclick="filterCategory('شوربة وطواجن')" id="btn-شوربة" class="category-tab px-4 py-1.5 rounded-full text-xs font-bold transition-all whitespace-nowrap bg-gray-100 text-gray-700 hover:bg-oceanBlue hover:text-white">
                شوربة وطواجن
            </button>
            <button onclick="filterCategory('مشروبات وحلويات')" id="btn-مشروبات" class="category-tab px-4 py-1.5 rounded-full text-xs font-bold transition-all whitespace-nowrap bg-gray-100 text-gray-700 hover:bg-oceanBlue hover:text-white">
                مشروبات وحلويات
            </button>
        </div>
    </nav>

    <!-- Main Menu Content Container -->
    <main class="container mx-auto px-4 py-6">
        <div id="menu-container" class="space-y-4">
            <!-- Rendered via JavaScript -->
        </div>
    </main>

    <!-- Fixed Bottom Cart & Total Weight/Price Bar (Compact) -->
    <div id="bottom-cart-bar" class="fixed bottom-0 left-0 right-0 z-50 bg-deepNavy/95 backdrop-blur-md text-white border-t border-oceanBlue/40 shadow-xl py-3 px-4 transition-all">
        <div class="container mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="bg-accentGold text-deepNavy p-2 rounded-xl font-black text-sm shadow-inner">
                    ⚖️
                </div>
                <div>
                    <p class="text-[10px] text-gray-300">مجموع الكمية / الوزن</p>
                    <p id="total-weight-display" class="text-xs md:text-sm font-black text-seaCyan">0 جرام</p>
                </div>
                <div class="border-r border-white/25 pr-3 mr-1">
                    <p class="text-[10px] text-gray-300">إجمالي المبلغ المطلوب</p>
                    <p id="total-price-display" class="text-xs md:text-sm font-black text-accentGold">0 ج.م</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- زر حذف الطلبات وإفراغ السلة -->
                <button onclick="clearCart()" class="bg-red-600 hover:bg-red-700 text-white px-3.5 py-2 rounded-xl transition-all shadow-md flex items-center justify-center text-xs md:text-sm cursor-pointer" title="حذف كل الطلبات">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
                <button onclick="addToCart()" class="bg-accentGold hover:bg-amber-500 text-deepNavy font-black px-6 py-2 rounded-xl transition-all shadow-md flex items-center gap-1 text-xs md:text-sm cursor-pointer">
                    إضافة إلى السلة
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-deepNavy text-white py-6 border-t border-oceanBlue/30 mb-14 text-center">
        <div class="container mx-auto px-4 flex flex-col items-center justify-center gap-3">
            <p class="text-xs md:text-sm text-gray-300">&copy; جميع الحقوق محفوظة - مطعم اسماك ابن حميدو</p>
            <div class="footer-credits flex items-center justify-center gap-3 text-xs">
                <span class="text-gray-400">تصميم بواسطة</span>
                <img src="100.png" alt="شعار التصميم" class="w-6 h-6 object-contain">
                <a href="tel:01010255123" class="footer-btn" title="اتصال هاتفي"><i class="fa-solid fa-phone"></i></a>
                <a href="https://wa.me/201010255123" target="_blank" class="footer-btn" title="مراسلة عبر الواتساب"><i class="fa-brands fa-whatsapp"></i></a>
            </div>
        </div>
    </footer>

    <!-- Main Menu Logic & Data -->
    <script>
        const menuData = [
            {
                "category": "الأسماك",
                "nameAr": "سمك بلطي",
                "nameEng": "Bolti Fish",
                "desc": "سمك بلطي طازج يومياً",
                "price": 150,
                "unit": "ج.م / كيلو",
                "status": "متوفر",
                "cookingMethods": ["ردة", "مقلي", "زيت", "صينية"]
            },
            {
                "category": "الأسماك",
                "nameAr": "بوري",
                "nameEng": "Bouri Fish",
                "desc": "سمك بوري طازج مرمل",
                "price": 200,
                "unit": "ج.م / كيلو",
                "status": "متوفر",
                "cookingMethods": ["مقلي", "مشوي", "زيت"]
            },
            {
                "category": "الأسماك",
                "nameAr": "السيجان",
                "nameEng": "Al-Sigan Fish",
                "desc": "سمك سيجان بحري طازج",
                "price": 175,
                "unit": "ج.م / كيلو",
                "status": "متوفر",
                "cookingMethods": ["مقلي", "مشوي"]
            },
            {
                "category": "الأسماك",
                "nameAr": "سمك فيليه",
                "nameEng": "Fish Fillet",
                "desc": "فيليه سمك طازج ونقي بدون شوك",
                "price": 150,
                "unit": "ج.م / كيلو",
                "status": "متوفر",
                "cookingMethods": ["مقلي", "مشوى"]
            },
            {
                "category": "الجمبري",
                "nameAr": "جمبري وسط",
                "nameEng": "Medium Shrimp",
                "desc": "جمبري وسط طازج يجهز بالخلطة أو المقلي أو الطاجن",
                "price": 500,
                "unit": "ج.م / كيلو",
                "status": "متوفر",
                "cookingMethods": ["مقلي", "مشوي", "طاجن"]
            },
            {
                "category": "الجمبري",
                "nameAr": "جمبري كبير",
                "nameEng": "Large Shrimp",
                "desc": "جمبري كبير طازج يجهز بالخلطة أو المقلي أو الطاجن",
                "price": 600,
                "unit": "ج.م / كيلو",
                "status": "متوفر",
                "cookingMethods": ["مقلي", "مشوي", "طاجن"]
            },
            {
                "category": "الجمبري",
                "nameAr": "جمبري جامبو",
                "nameEng": "Jumbo Shrimp",
                "desc": "جمبري جامبو فاخر طازج يجهز بالخلطة أو المقلي أو الطاجن",
                "price": 750,
                "unit": "ج.م / كيلو",
                "status": "متوفر",
                "cookingMethods": ["مقلي", "مشوي", "طاجن"]
            },
            {
                "category": "المقبلات والسلطات",
                "nameAr": "سلطة خضراء",
                "nameEng": "Green Salad",
                "desc": "خضروات طازجة ومتبلة على طريقة ابن حميدو الخاصة",
                "price": 25,
                "unit": "ج.م",
                "status": "متوفر",
                "cookingMethods": ["عادي", "حراق"]
            },
            {
                "category": "المقبلات والسلطات",
                "nameAr": "سلطة طحينة",
                "nameEng": "Tahini Salad",
                "desc": "طحينة بيتي غنية بالثوم والكمون والليمون",
                "price": 20,
                "unit": "ج.م",
                "status": "متوفر",
                "cookingMethods": ["عادي", "حراق"]
            },
            {
                "category": "شوربة وطواجن",
                "nameAr": "شوربة سي فود ريتش",
                "nameEng": "Rich Seafood Soup",
                "desc": "تشكيلة بحرية غنية من الجمبري والسبيط والسمك",
                "price": 110,
                "unit": "ج.م",
                "status": "متوفر",
                "cookingMethods": [
                    {"name": "عادي", "price": 110},
                    {"name": "كريمة", "price": 130}
                ]
            },
            {
                "category": "مشروبات وحلويات",
                "nameAr": "عصير ليمون نعناع فريش",
                "nameEng": "Lemon Mint Juice",
                "desc": "عصير ليمون طبيعي منعش مع أوراق النعناع الطازجة",
                "price": 35,
                "unit": "ج.م",
                "status": "متوفر",
                "cookingMethods": ["بارد", "مثلج"]
            }
        ];

        let currentCategory = 'الأسماك';
        let userSelections = {};

        // استرجاع السلة والخيارات القديمة عند فتح الصفحة لأول مرة
        function loadSavedCartToSelections() {
            const savedCartStr = localStorage.getItem('ibnHameedoCart');
            if (savedCartStr) {
                try {
                    const savedCart = JSON.parse(savedCartStr);
                    if (savedCart && savedCart.items) {
                        savedCart.items.forEach(cartItem => {
                            menuData.forEach(item => {
                                if (item.nameAr === cartItem.name && item.cookingMethods) {
                                    item.cookingMethods.forEach(m => {
                                        const mName = typeof m === 'object' ? m.name : m;
                                        if (cartItem.methods.includes(mName)) {
                                            const inputKey = `${item.nameAr}_${mName}`;
                                            userSelections[inputKey] = cartItem.weight;
                                        }
                                    });
                                }
                            });
                        });
                    }
                } catch (e) {
                    console.error("خطأ في استرجاع بيانات السلة", e);
                }
            }
        }

        // دالة حذف وإفراغ السلة بالكامل
        function clearCart() {
            if (confirm('هل أنت متأكد من حذف جميع الطلبات وإفراغ السلة؟')) {
                localStorage.removeItem('ibnHameedoCart');
                userSelections = {};
                
                // تفريغ خانات الإدخال الظاهرة حالياً على الشاشة
                document.querySelectorAll('.weight-input').forEach(input => {
                    input.value = '';
                });
                
                calculateTotals();
            }
        }

        function renderMenu(categoryToFilter = 'الأسماك') {
            const container = document.getElementById('menu-container');
            if (!container) return;
            
            saveCurrentInputs();
            container.innerHTML = '';

            const filteredItems = menuData.filter(item => item.category === categoryToFilter);

            if (filteredItems.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-gray-500 text-xs">
                        <p>عذراً، لا توجد أصناف متاحة في هذا القسم حالياً.</p>
                    </div>
                `;
                return;
            }

            let sectionHTML = `
                <div class="space-y-3">
                    <div class="grid grid-cols-1 gap-3">
            `;

            filteredItems.forEach((item) => {
                let methodsHTML = '';
                if (item.cookingMethods) {
                    item.cookingMethods.forEach(m => {
                        const methodName = typeof m === 'object' ? m.name : m;
                        const methodPrice = typeof m === 'object' ? m.price : item.price;
                        const inputKey = `${item.nameAr}_${methodName}`;
                        const savedVal = userSelections[inputKey] || '';
                        
                        methodsHTML += `
                            <div class="bg-gray-50 hover:bg-blue-50/40 p-2.5 rounded-xl border border-gray-200 flex items-center justify-between gap-2 transition-all">
                                <div class="flex flex-col">
                                    <span class="text-xs font-bold text-gray-800">${methodName}</span>
                                    ${typeof m === 'object' ? `<span class="text-[10px] text-accentGold font-bold">${methodPrice} ج.م</span>` : ''}
                                </div>
                                <div class="inline-flex items-center gap-1 bg-white border border-gray-200 rounded-lg px-2 py-1 shadow-sm">
                                    <input type="number" step="${item.category === 'الأسماك' || item.category === 'الجمبري' ? 50 : 1}" min="0" placeholder="0" value="${savedVal}" oninput="saveCurrentInputs(); calculateTotals()" class="weight-input w-20 text-center font-bold text-oceanBlue focus:outline-none bg-transparent text-xs" data-name="${item.nameAr}" data-method="${methodName}" data-price="${methodPrice}" data-category="${item.category}" data-unit="${item.unit || 'ج.م'}" data-key="${inputKey}">
                                    <span class="text-[10px] font-bold text-oceanBlue">${item.category === 'الأسماك' || item.category === 'الجمبري' ? 'جم' : 'عدد'}</span>
                                </div>
                            </div>
                        `;
                    });
                }

                const displayUnit = item.unit ? item.unit : 'ج.م';

                sectionHTML += `
                    <div class="item-card bg-white rounded-2xl shadow-sm border border-gray-100 p-4 transition-all hover:shadow-md">
                        <div class="flex justify-between items-center pb-2.5 border-b border-gray-100">
                            <div>
                                <h3 class="text-sm md:text-base font-black text-gray-900">${item.nameAr}</h3>
                                <p class="text-[11px] text-gray-400">${item.desc}</p>
                            </div>
                            <div class="text-left">
                                <span class="text-sm md:text-base font-black text-accentGold">${item.price} <small class="text-[10px] text-gray-500">${displayUnit}</small></span>
                            </div>
                        </div>

                        <div class="pt-2.5">
                            <div class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-4 gap-2">
                                ${methodsHTML}
                            </div>
                        </div>
                    </div>
                `;
            });

            sectionHTML += `</div></div>`;
            container.innerHTML += sectionHTML;
            calculateTotals();
        }

        function saveCurrentInputs() {
            const inputs = document.querySelectorAll('.weight-input');
            inputs.forEach(input => {
                const key = input.getAttribute('data-key');
                if (key) {
                    userSelections[key] = input.value;
                }
            });
        }

        function calculateTotals() {
            saveCurrentInputs();
            let totalWeightOrCount = 0;
            let totalPrice = 0;

            Object.keys(userSelections).forEach(key => {
                const val = parseFloat(userSelections[key]);
                if (!isNaN(val) && val > 0) {
                    let matchedCategory = '';
                    let matchedPrice = 0;

                    menuData.forEach(item => {
                        if (item.cookingMethods) {
                            item.cookingMethods.forEach(m => {
                                const mName = typeof m === 'object' ? m.name : m;
                                const mPrice = typeof m === 'object' ? m.price : item.price;
                                if (`${item.nameAr}_${mName}` === key) {
                                    matchedCategory = item.category;
                                    matchedPrice = mPrice;
                                }
                            });
                        }
                    });

                    if (matchedCategory) {
                        totalWeightOrCount += val;
                        if (matchedCategory === 'الأسماك' || matchedCategory === 'الجمبري') {
                            totalPrice += (matchedPrice / 1000) * val;
                        } else {
                            totalPrice += matchedPrice * val;
                        }
                    }
                }
            });

            const weightDisplay = document.getElementById('total-weight-display');
            const priceDisplay = document.getElementById('total-price-display');

            if (weightDisplay) {
                if (totalWeightOrCount >= 1000) {
                    const kg = (totalWeightOrCount / 1000).toFixed(2);
                    weightDisplay.textContent = `${kg} كجم (${totalWeightOrCount} جم)`;
                } else {
                    weightDisplay.textContent = `${totalWeightOrCount} وحدة / جم`;
                }
            }

            if (priceDisplay) {
                priceDisplay.textContent = `${totalPrice.toFixed(2)} ج.م`;
            }
        }

        function addToCart() {
            saveCurrentInputs();
            let cartItems = [];
            let totalWeightOrCount = 0;
            let grandTotal = 0;

            Object.keys(userSelections).forEach(key => {
                const val = parseFloat(userSelections[key]);
                if (!isNaN(val) && val > 0) {
                    let matchedName = '';
                    let matchedMethod = '';
                    let matchedCategory = '';
                    let matchedPrice = 0;

                    menuData.forEach(item => {
                        if (item.cookingMethods) {
                            item.cookingMethods.forEach(m => {
                                const mName = typeof m === 'object' ? m.name : m;
                                const mPrice = typeof m === 'object' ? m.price : item.price;
                                if (`${item.nameAr}_${mName}` === key) {
                                    matchedCategory = item.category;
                                    matchedPrice = mPrice;
                                    matchedName = item.nameAr;
                                    matchedMethod = mName;
                                }
                            });
                        }
                    });

                    if (matchedCategory) {
                        let itemPrice = 0;
                        if (matchedCategory === 'الأسماك' || matchedCategory === 'الجمبري') {
                            itemPrice = (matchedPrice / 1000) * val;
                        } else {
                            itemPrice = matchedPrice * val;
                        }

                        totalWeightOrCount += val;
                        grandTotal += itemPrice;

                        cartItems.push({
                            name: matchedName,
                            weight: val,
                            methods: [matchedMethod],
                            price: itemPrice
                        });
                    }
                }
            });

            if (cartItems.length === 0) {
                alert('يرجى تحديد الكمية أو الوزن لأي صنف في أي قسم أولاً!');
                return;
            }

            const cartData = {
                items: cartItems,
                totalWeight: totalWeightOrCount,
                grandTotal: grandTotal
            };

            localStorage.setItem('ibnHameedoCart', JSON.stringify(cartData));
            window.location.href = 'receipt.html';
        }

        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.classList.remove('active', 'bg-oceanBlue', 'text-white');
                tab.classList.add('bg-gray-100', 'text-gray-700');
            });

            const btnMap = {
                'الأسماك': 'btn-الأسماك',
                'الجمبري': 'btn-الجمبري',
                'المقبلات والسلطات': 'btn-المقبلات',
                'شوربة وطواجن': 'btn-شوربة',
                'مشروبات وحلويات': 'btn-مشروبات'
            };

            const activeBtnId = btnMap[category];
            if (activeBtnId) {
                const btn = document.getElementById(activeBtnId);
                if (btn) {
                    btn.classList.remove('bg-gray-100', 'text-gray-700');
                    btn.classList.add('active');
                }
            }

            renderMenu(category);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadSavedCartToSelections();
            renderMenu('الأسماك');
        });
    </script>
</body>
</html>
